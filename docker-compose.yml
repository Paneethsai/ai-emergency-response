version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/ai_emergency
      - JWT_SECRET=your_jwt_secret
      - FIREBASE_PROJECT_ID=your_project_id
      - FIREBASE_CLIENT_EMAIL=your_client_email
      - FIREBASE_PRIVATE_KEY=your_private_key
      - GEMINI_API_KEY=your_gemini_key
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
